<html>
    <head>
        <meta charset="UTF-8"
        <title> my first HTML page</title>
    </head>
    <body>
        <form>
            <table border="2" bordercolor="yellow" bgcolor="green" width="400px" align="center">
                <tr>
                    <td colspan="2" align="center"> Phiếu đăng kí </td>
                </tr>
                <tr>
                    <td>Họ và tên:</td>
                    <td><input type="text" name="Họ và tên"></td>
                </tr>
                <tr>
                    <td>Địa chỉ:</td>
                    <td><input type="text" name="Địa chỉ"></td>
                </tr>
                <tr>
                    <td>Điện thoại:</td>
                    <td><input type="text" name="Điện thoại"></td>
                </tr>
                <tr>
                    <td>Phái:</td>
                    <td>
                        <input type="radio" name="Phái" value="Nam"> Nam
                        <input type="radio" name="Phái" value="Nữ"> Nữ
                    </td>
                    <tr>
                    <td>Nghề nghiệp:</td>
                    <td>
                        <select name="nghenghiep">
                            <option value="bacsi">Bác sĩ</option>
                            <option value="hocsinh">Học sinh</option>
                            <option value="giaovien">Giáo viên</option>
                        </select>
                    </td>
                    <tr>
                        <td>Chọn sản phẩm tham gia:</td>
                        <td>
                            <select name="sanpham">
                                <option value="kemdanhrang">Kem đánh răng</option>
                                <option value="suaruamat">Sữa rửa mặt</option>
                                <option value="daugoi">Dầu gội</option>
                            </select>
                        </td>
                    </tr>
                </tr>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Đồng ý">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
